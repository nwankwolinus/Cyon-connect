# Supabase local development configuration (CLI). Contains no secrets.
# NOT YET VERIFIED against the Supabase CLI in this repository's CI; see docs/architecture/ARCHITECTURE.md.
project_id = "cyon-connect"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
# Default-deny: self sign-up stays off until the identity sprint (1B) defines the membership/account flow.
enable_signup = false
