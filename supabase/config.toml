# Supabase local development configuration (CLI). Contains no secrets.
# NOT YET VERIFIED against the Supabase CLI in this repository's CI; see docs/architecture/ARCHITECTURE.md.
project_id = "cyon-connect-security-test-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/callback?flow=confirmation",
  "http://localhost:3000/auth/callback?flow=recovery",
  "http://localhost:3000/auth/reset-password",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/callback?flow=confirmation",
  "http://127.0.0.1:3000/auth/callback?flow=recovery",
  "http://127.0.0.1:3000/auth/reset-password",
]
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Keep the email provider enabled for sign-in and confirmation. The global
# [auth] enable_signup=false setting blocks public identity creation.
enable_signup = true
# Confirmation is required locally; Supabase auto-confirm must remain disabled.
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Confirm your CYON Connect email address"
content_path = "./supabase/templates/applicant-confirmation.html"
